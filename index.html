<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Wealth" />
  <meta name="theme-color" content="#000000" />
  <title>Wealth · 個人財務管理</title>
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'><rect width='180' height='180' rx='40' fill='%230B0B0D'/><rect x='34' y='52' width='112' height='76' rx='18' fill='none' stroke='%23FFFFFF' stroke-width='8'/><circle cx='122' cy='90' r='8' fill='%2334D399'/></svg>" />
  <script>
    (function () {
      var isStandalone = window.navigator.standalone === true ||
        (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
      var isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      function syncAppHeight() {
        var h = window.innerHeight;
        if (isStandalone && isIOS && window.screen && window.screen.height) {
          h = Math.max(window.innerHeight, window.screen.height);
        }
        document.documentElement.style.setProperty('--app-height', h + 'px');
      }
      syncAppHeight();
      window.addEventListener('resize', syncAppHeight);
      window.addEventListener('orientationchange', function () { setTimeout(syncAppHeight, 120); });
      window.addEventListener('focusout', function () { setTimeout(syncAppHeight, 80); });
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --app-height: 100dvh;
    }
    html, body, #root {
      height: var(--app-height);
      min-height: var(--app-height);
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 0;
      overflow: hidden;
      overscroll-behavior-y: none;
      -webkit-tap-highlight-color: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Noto Sans TC', sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    .app-viewport {
      height: var(--app-height);
      min-height: var(--app-height);
      display: flex;
      flex-direction: column;
      background-color: #000000;
      overflow: hidden;
    }
    .app-scroll-main {
      flex: 1;
      min-height: 0;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    /* 杜絕 iPhone Safari 輸入框自動放大 */
    input, select, textarea {
      font-size: 16px !important;
    }
    .font-mono-num {
      font-family: 'JetBrains Mono', monospace;
      font-variant-numeric: tabular-nums;
    }
    .snap-x-rail {
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
    }
    .snap-x-item {
      scroll-snap-align: start;
    }
    .wallet-card-transition {
      transition: all 0.42s cubic-bezier(0.32, 0.72, 0, 1);
      transform-origin: top center;
      will-change: transform, margin;
    }
    .wallet-card-shine {
      background: linear-gradient(135deg, rgba(255,255,255,0.22) 0%, rgba(255,255,255,0.03) 45%, rgba(0,0,0,0.32) 100%);
    }
    @keyframes walletCardSpringUp {
      0% { opacity: 0.55; transform: translateY(44px) scale(0.95); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-card-spring {
      animation: walletCardSpringUp 0.38s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes popUpMenu {
      0% { opacity: 0; transform: translateY(10px) scale(0.94); }
      100% { opacity: 1; transform: translateY(0) scale(1); }
    }
    .animate-pop-up {
      animation: popUpMenu 0.18s cubic-bezier(0.2, 0.9, 0.3, 1) forwards;
    }
    @keyframes slideUpSheet {
      0% { transform: translateY(100%); opacity: 0.7; }
      100% { transform: translateY(0); opacity: 1; }
    }
    .animate-sheet-up {
      animation: slideUpSheet 0.28s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .animate-fade {
      animation: fadeIn 0.18s ease forwards;
    }
    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      background: rgba(255, 255, 255, 0.14);
      height: 6px;
      border-radius: 999px;
    }
    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #ffffff;
      box-shadow: 0 2px 8px rgba(0,0,0,0.6);
      cursor: pointer;
    }
    ::-webkit-scrollbar {
      width: 0px;
      height: 0px;
      background: transparent;
    }
  </style>
</head>
<body class="bg-black text-white select-none">
  <div id="root"></div>
  <script src="js/store.js?v=1.9-stage1-r9"></script>
  <script type="text/babel" src="js/ui.js?v=1.9-stage1-r9"></script>
  <script type="text/babel" src="js/mod1_wallet.js?v=1.9-stage1-r9"></script>
  <script type="text/babel" src="js/mod3_ledger.js?v=1.9-stage1-r9"></script>
  <script type="text/babel" src="js/app.js?v=1.9-stage1-r9"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('./sw.js').then(function (reg) {
          reg.update();
        }).catch(function () {});
      });
    }
  </script>
</body>
</html>
