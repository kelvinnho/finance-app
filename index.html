  <script>
    (function syncViewportHeight() {
      function update() {
        var ua = navigator.userAgent || '';
        var isIOS = /iPad|iPhone|iPod/.test(ua) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
        var isStandalone = window.navigator.standalone === true ||
          (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
        var h;
        if (isIOS && isStandalone) {
          var isLandscape = window.innerWidth > window.innerHeight;
          var physH = isLandscape
            ? Math.min(window.screen.width, window.screen.height)
            : Math.max(window.screen.width, window.screen.height);
          h = Math.max(window.innerHeight, physH);
        } else {
          h = window.innerHeight;
        }
        document.documentElement.style.setProperty('--app-height', h + 'px');
        window.__VIEWPORT_DIAG__ = {
          isIOS: isIOS,
          isStandalone: isStandalone,
          innerHeight: window.innerHeight,
          screenHeight: window.screen.height,
          appliedHeight: h
        };
      }
      update();
      window.addEventListener('resize', update);
      window.addEventListener('orientationchange', function() { setTimeout(update, 150); });
      window.addEventListener('focusout', function() {
        setTimeout(update, 120);
        setTimeout(update, 360);
      });
    })();
  </script>
  <script src="https://cdn.tailwindcss.com"></script>

  <style>
    :root {

    html, body {

      width: 100%;
      height: var(--app-height, 100dvh);
      background-color: #000000;
      color: #F5F5F7;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;

      user-select: none;

    }
    #root {
      width: 100%;
      height: var(--app-height, 100dvh);
      overflow: hidden;
      background-color: #000000;
    }
    input, textarea, select {
      -webkit-user-select: text;
      user-select: text;
      box-sizing: border-box;

    input[type="date"], input[type="time"] {

      appearance: none;
      min-width: 0;
      max-width: 100%;

    .tabular-nums {

    }
    .no-scrollbar::-webkit-scrollbar {

    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
    .app-scroll-main {
      -webkit-overflow-scrolling: touch;
      overscroll-behavior-y: contain;
    }
    .safe-top {

    }
    .safe-bottom-nav {
      padding-bottom: max(10px, calc(env(safe-area-inset-bottom) - 6px));
    }
    @keyframes sheetUp {
      from { transform: translateY(100%); opacity: 0.6; }
      to { transform: translateY(0); opacity: 1; }
    }
    @keyframes popScale {
      from { transform: scale(0.92); opacity: 0; }
      to { transform: scale(1); opacity: 1; }
    }
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    .anim-sheet-up {
      animation: sheetUp 0.24s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }
    .anim-pop-scale {
      animation: popScale 0.18s cubic-bezier(0.22, 1, 0.36, 1) forwards;
      transform-origin: bottom center;
    }
    .anim-fade-in {
      animation: fadeIn 0.18s ease-out forwards;
    }
  </style>
